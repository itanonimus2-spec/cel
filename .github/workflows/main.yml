name: Send Static Target to TG

on:
  workflow_dispatch: {}

jobs:
  send-static:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send static test target to Telegram
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request, urllib.parse

          TOKEN = os.environ["TG_BOT_TOKEN"]
          CHAT_ID = os.environ["TG_CHAT_ID"]

          static_target = {
              "id": "test-99901",
              "name": "БпЛА (тест)",
              "type": "fpv",
              "status": "active",
              "lat": 48.5087,
              "lng": 34.6138,
              "speed": 140,
              "bearing": 215,
              "city": "Кам’янське",
          }

          text = (
              f"🔴 <b>Тестове сповіщення (статична ціль)</b>\n"
              f"━━━━━━━━━━━━━━━━━━━━\n"
              f"🎯 <b>Об’єкт:</b> {static_target['name']} (<code>{static_target['type']}</code>)\n"
              f"📍 <b>Населений пункт:</b> <u>{static_target['city']}</u>\n"
              f"⚡ <b>Швидкість / курс:</b> <code>{static_target['speed']} км/год</code> / <code>{static_target['bearing']}°</code>\n"
              f"🧭 <b>Координати:</b> <code>{static_target['lat']}, {static_target['lng']}</code>\n"
              f"🆔 <b>ID:</b> <code>{static_target['id']}</code>"
          )

          tg_url = f"https://api.telegram.org/bot{TOKEN}/sendMessage"
          payload = urllib.parse.urlencode({
              "chat_id": CHAT_ID,
              "text": text,
              "parse_mode": "HTML",
              "disable_web_page_preview": "true",
          }).encode("utf-8")

          req = urllib.request.Request(tg_url, data=payload, method="POST")
          try:
              with urllib.request.urlopen(req, timeout=20) as resp:
                  body = resp.read().decode("utf-8", errors="replace")
                  res = json.loads(body)
                  print("TG response:", res)
                  if not res.get("ok"):
                      raise SystemExit(1)
          except Exception as e:
              print("TG error:", e)
              raise SystemExit(1)
          EOF
