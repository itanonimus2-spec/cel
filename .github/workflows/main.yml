name: Neptun Live Dnipro Monitor

on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch: {}

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Restore notified state
        uses: actions/cache@v4
        with:
          path: dnipro_neptun_state.json
          key: dnipro-neptun-live-${{ github.run_id }}
          restore-keys: |
            dnipro-neptun-live-

      - name: Fetch Neptun live API and send alerts to Telegram
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          NEPTUN_CF_CLEARANCE: ${{ secrets.NEPTUN_CF_CLEARANCE }}
        run: |
          python3 - <<'EOF'
          import gzip
          import http.cookiejar
          import io
          import json
          import math
          import os
          import time
          import urllib.parse
          import urllib.request
          import zlib

          TOKEN = os.environ["TG_BOT_TOKEN"]
          CHAT_ID = os.environ["TG_CHAT_ID"]
          CF_CLEARANCE = os.environ.get("NEPTUN_CF_CLEARANCE", "").strip()
          STATE_FILE = "dnipro_neptun_state.json"

          # Границы Днепропетровской области
          LAT_MIN, LAT_MAX = 47.2, 49.2
          LON_MIN, LON_MAX = 32.6, 36.9

          SETTLEMENTS = {
              "Дніпро": (48.4647, 35.0462),
              "Кривий Ріг": (47.9105, 33.3918),
              "Кам’янське": (48.5087, 34.6138),
              "Нікополь": (47.5712, 34.3964),
              "Павлоград": (48.5167, 35.8667),
              "Новомосковськ": (48.6333, 35.2250),
              "Марганець": (47.6431, 34.6136),
              "Покров": (47.6514, 34.0842),
              "Синельникове": (48.3167, 35.5167),
              "Першотравенськ": (48.3489, 36.4036),
              "Тернівка": (48.5242, 36.0778),
              "Вільногірськ": (48.4789, 34.0272),
              "П’ятихатки": (48.4119, 33.7022),
              "Апостолове": (47.6572, 33.7117),
              "Царичанка": (48.9400, 34.4600),
              "Покровське": (47.9833, 36.2333),
          }

          def haversine_km(lat1, lon1, lat2, lon2):
              r = 6371.0
              p1 = math.radians(lat1)
              p2 = math.radians(lat2)
              dp = math.radians(lat2 - lat1)
              dl = math.radians(lon2 - lon1)
              a = math.sin(dp / 2) ** 2 + math.cos(p1) * math.cos(p2) * math.sin(dl / 2) ** 2
              return 2 * r * math.asin(min(1.0, math.sqrt(a)))

          def nearest_settlement(lat, lon):
              best_name = None
              best_dist = None
              for name, (slat, slon) in SETTLEMENTS.items():
                  d = haversine_km(lat, lon, slat, slon)
                  if best_dist is None or d < best_dist:
                      best_dist = d
                      best_name = name
              return best_name, round(best_dist, 1) if best_dist is not None else None

          def is_dnipro_region(threat):
              region = str(threat.get("region") or "").lower()
              if "дніпропетров" in region or "днепропетров" in region:
                  return True
              try:
                  lat = float(threat.get("lat"))
                  lon = float(threat.get("lon"))
              except (TypeError, ValueError):
                  return False
              return (LAT_MIN <= lat <= LAT_MAX) and (LON_MIN <= lon <= LON_MAX)

          def load_state():
              if not os.path.exists(STATE_FILE):
                  return {"sent": {}}
              try:
                  with open(STATE_FILE, "r", encoding="utf-8") as f:
                      data = json.load(f)
                  if isinstance(data, dict) and isinstance(data.get("sent"), dict):
                      return data
              except Exception:
                  pass
              return {"sent": {}}

          def save_state(state):
              sent = state.get("sent", {})
              if len(sent) > 500:
                  keys = list(sent.keys())[-500:]
                  state["sent"] = {k: sent[k] for k in keys}
              with open(STATE_FILE, "w", encoding="utf-8") as f:
                  json.dump(state, f, ensure_ascii=False, indent=2)

          def build_opener():
              cj = http.cookiejar.CookieJar()
              return urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))

          def decode_response_body(resp):
              raw = resp.read()
              enc = (resp.headers.get("Content-Encoding") or "").lower()
              if "gzip" in enc:
                  raw = gzip.GzipFile(fileobj=io.BytesIO(raw)).read()
              elif "deflate" in enc:
                  raw = zlib.decompress(raw)
              return raw.decode("utf-8", errors="replace").strip()

          def fetch_neptun_live():
              opener = build_opener()
              headers = {
                  "Accept": "*/*",
                  "Accept-Encoding": "gzip, deflate",
                  "Accept-Language": "en-US,en;q=0.9,ru-UA;q=0.8,ru;q=0.7",
                  "Cache-Control": "no-cache",
                  "Pragma": "no-cache",
                  "Referer": "https://neptun.in.ua/",
                  "Origin": "https://neptun.in.ua",
                  "Sec-Ch-Ua": '"Chromium";v="158", "Not.A/Brand";v="24", "Google Chrome";v="158"',
                  "Sec-Ch-Ua-Mobile": "?0",
                  "Sec-Ch-Ua-Platform": '"Windows"',
                  "Sec-Fetch-Dest": "empty",
                  "Sec-Fetch-Mode": "cors",
                  "Sec-Fetch-Site": "same-origin",
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/158.0.0.0 Safari/537.36",
              }
              if CF_CLEARANCE:
                  headers["Cookie"] = f"cf_clearance={CF_CLEARANCE}"

              # Легкий прогрев главной страницы перед запросом к API
              try:
                  warm_req = urllib.request.Request("https://neptun.in.ua/", headers={
                      "User-Agent": headers["User-Agent"],
                      "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
                      "Accept-Language": headers["Accept-Language"],
                      "Cookie": headers.get("Cookie", ""),
                  })
                  with opener.open(warm_req, timeout=15) as _:
                      pass
              except Exception:
                  pass

              api_req = urllib.request.Request("https://neptun.in.ua/api/v1/live", headers=headers)
              with opener.open(api_req, timeout=20) as resp:
                  text = decode_response_body(resp)

              try:
                  data = json.loads(text)
              except Exception as e:
                  snippet = " ".join(text.split())[:220]
                  raise RuntimeError(f"Neptun returned non-JSON ({e}): {snippet}")

              if not isinstance(data, dict) or not isinstance(data.get("threats"), list):
                  raise RuntimeError(f"Unexpected Neptun payload structure: {str(data)[:220]}")

              return data

          def send_tg(text):
              tg_url = f"https://api.telegram.org/bot{TOKEN}/sendMessage"
              payload = urllib.parse.urlencode({
                  "chat_id": CHAT_ID,
                  "text": text,
                  "parse_mode": "HTML",
                  "disable_web_page_preview": "true",
              }).encode("utf-8")
              req = urllib.request.Request(tg_url, data=payload, method="POST")
              with urllib.request.urlopen(req, timeout=20) as resp:
                  res = json.loads(resp.read().decode("utf-8", errors="replace"))
                  if not res.get("ok"):
                      raise RuntimeError(f"Telegram API error: {res}")

          try:
              payload_data = fetch_neptun_live()
          except Exception as e:
              print(f"Neptun fetch error: {e}")
              raise SystemExit(1)

          threats = payload_data.get("threats") or []
          dnipro_threats = [t for t in threats if isinstance(t, dict) and is_dnipro_region(t)]
          print(f"Total threats: {len(threats)} | Dnipro region threats: {len(dnipro_threats)}")

          state = load_state()
          sent_map = state["sent"]
          new_count = 0

          for t in dnipro_threats:
              tid = str(t.get("id") or "")
              if not tid:
                  continue
              stamp = f"{t.get('updatedAt', '')}|{t.get('detailsRev', '')}|{t.get('status', '')}"
              if sent_map.get(tid) == stamp:
                  continue

              title = t.get("title") or "Повітряна ціль"
              ttype = t.get("type") or "-"
              subtype = t.get("subtype") or ""
              type_str = f"{ttype}/{subtype}" if subtype else str(ttype)

              region = t.get("region") or "Дніпропетровська область"
              locality = t.get("locality") or "—"
              heading = t.get("heading")
              heading_str = f"{heading}°" if heading not in (None, "") else "не вказано"

              lat = t.get("lat")
              lon = t.get("lon")
              coords_str = f"{lat}, {lon}" if lat is not None and lon is not None else "—"

              near_str = ""
              try:
                  near_name, near_km = nearest_settlement(float(lat), float(lon))
                  if near_name and near_km is not None:
                      near_str = f"\n📌 <b>Найближчий орієнтир:</b> {near_name} (~<code>{near_km} км</code>)"
              except (TypeError, ValueError):
                  pass

              sources = t.get("sourceCount")
              conf = t.get("confidenceLevel") or t.get("displayConfidence") or "-"
              short_desc = t.get("explanationShort") or ""
              updated_at = t.get("updatedAt") or ""

              lines = [
                  f"🚨 <b>{title}</b> (<code>{type_str}</code>)",
                  f"━━━━━━━━━━━━━━━━━━━━",
                  f"🗺 <b>Регіон:</b> {region}",
                  f"🏙 <b>Населений пункт:</b> {locality}{near_str}",
                  f"🧭 <b>Курс:</b> <code>{heading_str}</code>",
                  f"📍 <b>Координати:</b> <code>{coords_str}</code>",
                  f"🛡 <b>Підтверджень:</b> <code>{sources}</code> (<code>{conf}</code>)",
              ]
              if short_desc:
                  lines.append(f"ℹ️ {short_desc}")
              if updated_at:
                  lines.append(f"🕒 <code>{updated_at}</code>")
              lines.append(f"🆔 <code>{tid}</code>")

              message_text = "\n".join(lines)

              try:
                  send_tg(message_text)
                  sent_map[tid] = stamp
                  new_count += 1
                  print(f"Sent threat {tid} ({title} - {locality})")
                  time.sleep(0.4)
              except Exception as e:
                  print(f"Failed to send threat {tid}: {e}")

          save_state(state)
          print(f"Done. Newly sent: {new_count}")
          EOF
